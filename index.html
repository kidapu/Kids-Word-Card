<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>おしゃべりカード</title>
<style>
  :root{
    --paper:#E4EDF1;
    --paper-2:#F4F9FA;
    --ink:#26302F;
    --ink-soft:#6C7C7E;
    --red:#E4543C;
    --yellow:#F0AF35;
    --green:#43A87A;
    --blue:#3C82BE;
    --purple:#8467AC;
    --edge:rgba(0,0,0,.18);
    --r:22px;
    --font: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Zen Maru Gothic",
            "Rounded Mplus 1c", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, #FFFFFF 0%, transparent 42%),
      radial-gradient(circle at 88% 92%, #FFFFFF 0%, transparent 46%),
      var(--paper);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x:hidden;
    user-select:none;-webkit-user-select:none;
  }

  header{
    display:flex;align-items:center;gap:12px;
    padding:18px 20px 6px;max-width:900px;margin:0 auto;
  }
  h1{font-size:19px;letter-spacing:.04em;margin:0;font-weight:800;flex:1}
  h1 small{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.12em;margin-top:2px}

  .modes{display:flex;background:rgba(255,255,255,.7);border-radius:999px;padding:4px;gap:2px}
  .modes button{
    font:inherit;font-weight:800;font-size:13px;border:0;background:transparent;
    color:var(--ink-soft);padding:8px 16px;border-radius:999px;cursor:pointer;
  }
  .modes button[aria-pressed="true"]{background:var(--ink);color:#fff}

  main{max-width:900px;margin:0 auto;padding:10px 16px 48px}

  /* ---- grid ---- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
  @media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}

  .card{
    position:relative;border:0;font:inherit;cursor:pointer;
    background:var(--paper-2);
    border-radius:var(--r);
    padding:20px 12px 16px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:0 7px 0 var(--tint,#999), 0 12px 20px rgba(20,40,50,.14);
    transition:transform .09s ease, box-shadow .09s ease;
    transform:translateY(0);
  }
  .card:active{transform:translateY(6px);box-shadow:0 1px 0 var(--tint,#999), 0 4px 10px rgba(20,40,50,.14)}
  .card:focus-visible{outline:4px solid var(--ink);outline-offset:4px}
  .card .art{font-size:clamp(46px,13vw,64px);line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
  .card .en{font-size:17px;font-weight:800;letter-spacing:.01em}
  .card .ja{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .card .star{
    position:absolute;top:8px;right:10px;font-size:17px;
    opacity:0;transform:scale(.3) rotate(-25deg);transition:all .35s cubic-bezier(.2,1.7,.4,1);
  }
  .card.known .star{opacity:1;transform:scale(1) rotate(0)}

  /* ---- detail ---- */
  .veil{
    position:fixed;inset:0;background:rgba(24,42,48,.55);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:22px;z-index:20;
  }
  .veil.on{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .detail{
    background:var(--paper-2);border-radius:34px;width:min(380px,100%);
    padding:30px 24px 24px;text-align:center;position:relative;
    box-shadow:0 12px 0 var(--tint,#999), 0 26px 50px rgba(0,0,0,.3);
    animation:pop .34s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes pop{from{transform:scale(.72) translateY(24px);opacity:0}to{transform:none;opacity:1}}

  .detail .art{font-size:clamp(88px,26vw,124px);line-height:1;display:inline-block;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
  .detail.talking .art{animation:wob .5s ease infinite}
  @keyframes wob{
    0%,100%{transform:rotate(-3deg) scale(1.03)}
    50%{transform:rotate(3deg) scale(1.08)}
  }
  .detail .en{font-size:32px;font-weight:800;margin:10px 0 2px}
  .detail .ja{font-size:16px;font-weight:700;color:var(--ink-soft);margin-bottom:22px}

  .say{display:flex;gap:12px}
  .say button{
    flex:1;font:inherit;font-weight:800;font-size:16px;border:0;cursor:pointer;
    padding:17px 8px;border-radius:18px;color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .09s,box-shadow .09s;
  }
  .say button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
  .say .b-en{background:var(--tint,#3C82BE)}
  .say .b-ja{background:var(--ink)}

  .close{
    position:absolute;top:-14px;right:-8px;width:44px;height:44px;border-radius:50%;
    border:0;background:#fff;color:var(--ink);font-size:20px;font-weight:800;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }

  /* ---- quiz ---- */
  .quiz{text-align:center;padding-top:6px}
  .ask{
    font:inherit;font-weight:800;font-size:18px;border:0;cursor:pointer;color:#fff;
    background:var(--ink);border-radius:999px;padding:16px 30px;margin:6px 0 22px;
    box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .09s,box-shadow .09s;
  }
  .ask:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .ask.talking{animation:wob .5s ease infinite}
  .quiz .grid{grid-template-columns:repeat(3,1fr);gap:12px}
  .card.wrong{animation:no .4s ease}
  @keyframes no{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  .card.right{animation:yes .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes yes{0%{transform:scale(1)}45%{transform:scale(1.14) rotate(-4deg)}100%{transform:scale(1)}}
  .score{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.1em}

  .burst{position:fixed;inset:0;pointer-events:none;z-index:30}
  .burst span{position:absolute;font-size:26px;animation:fly .9s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}

  .note{max-width:900px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--ink-soft);line-height:1.7}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>おしゃべりカード<small>TAP TO LISTEN</small></h1>
  <div class="modes">
    <button id="m-book" aria-pressed="true">ずかん</button>
    <button id="m-quiz" aria-pressed="false">クイズ</button>
  </div>
</header>

<main>
  <section id="book"><div class="grid" id="bookGrid"></div></section>

  <section id="quiz" class="quiz" hidden>
    <p class="score" id="score">0 / 0</p>
    <button class="ask" id="ask">🔊 もういちど きく</button>
    <div class="grid" id="quizGrid"></div>
  </section>
</main>

<p class="note">
  試作版：音声はブラウザの読み上げ機能を使っています。端末によって声が変わったり、出ないことがあります。
</p>

<div class="veil" id="veil">
  <div class="detail" id="detail">
    <button class="close" id="close" aria-label="とじる">✕</button>
    <div class="art" id="dArt"></div>
    <div class="en" id="dEn"></div>
    <div class="ja" id="dJa"></div>
    <div class="say">
      <button class="b-en" id="sayEn">🔊 English</button>
      <button class="b-ja" id="sayJa">🔊 にほんご</button>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   データ：ここを増やすだけでカードが増えます。
   本番では art を画像パスに、音声を事前生成した mp3 に差し替える想定。
------------------------------------------------------------------ */
const CARDS = [
  {art:"🍎", en:"apple",  ja:"りんご",  tint:"var(--red)"},
  {art:"🐶", en:"dog",    ja:"いぬ",    tint:"var(--yellow)"},
  {art:"🐱", en:"cat",    ja:"ねこ",    tint:"var(--purple)"},
  {art:"🚌", en:"bus",    ja:"バス",    tint:"var(--blue)"},
  {art:"⭐", en:"star",   ja:"ほし",    tint:"var(--yellow)"},
  {art:"🌙", en:"moon",   ja:"つき",    tint:"var(--purple)"},
  {art:"🍌", en:"banana", ja:"バナナ",  tint:"var(--yellow)"},
  {art:"🐟", en:"fish",   ja:"さかな",  tint:"var(--blue)"},
  {art:"🚗", en:"car",    ja:"くるま",  tint:"var(--red)"},
  {art:"🌸", en:"flower", ja:"はな",    tint:"var(--red)"},
  {art:"☔", en:"rain",   ja:"あめ",    tint:"var(--blue)"},
  {art:"🍰", en:"cake",   ja:"ケーキ",  tint:"var(--green)"}
];

/* ---------------- 音声 ---------------- */
let voices = [];
const loadVoices = () => { voices = speechSynthesis.getVoices(); };
loadVoices();
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = loadVoices;

function pickVoice(lang){
  const head = lang.split("-")[0];
  return voices.find(v => v.lang.replace("_","-") === lang)
      || voices.find(v => v.lang.startsWith(head));
}
function speak(text, lang, el){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  const v = pickVoice(lang); if(v) u.voice = v;
  u.rate = lang.startsWith("en") ? 0.85 : 1;
  u.pitch = 1.1;
  if(el){
    u.onstart = () => el.classList.add("talking");
    u.onend = u.onerror = () => el.classList.remove("talking");
  }
  speechSynthesis.speak(u);
}

/* ---------------- ずかん ---------------- */
const known = new Set();          // 自分の環境では localStorage に保存すると◎
const bookGrid = document.getElementById("bookGrid");

function cardEl(c, i){
  const b = document.createElement("button");
  b.className = "card";
  b.style.setProperty("--tint", c.tint);
  b.dataset.i = i;
  b.innerHTML = `<span class="star">⭐</span>
    <span class="art">${c.art}</span>
    <span class="en">${c.en}</span>
    <span class="ja">${c.ja}</span>`;
  return b;
}
CARDS.forEach((c,i) => {
  const b = cardEl(c,i);
  b.addEventListener("click", () => open(i));
  bookGrid.appendChild(b);
});

/* ---------------- カードの詳細 ---------------- */
const veil = document.getElementById("veil");
const detail = document.getElementById("detail");
let cur = 0;

function open(i){
  cur = i;
  const c = CARDS[i];
  detail.style.setProperty("--tint", c.tint);
  document.getElementById("dArt").textContent = c.art;
  document.getElementById("dEn").textContent = c.en;
  document.getElementById("dJa").textContent = c.ja;
  veil.classList.add("on");
  speak(c.en, "en-US", detail);
  if(!known.has(i)){
    known.add(i);
    bookGrid.children[i].classList.add("known");
  }
}
function close(){ veil.classList.remove("on"); speechSynthesis.cancel(); }

document.getElementById("close").addEventListener("click", close);
veil.addEventListener("click", e => { if(e.target === veil) close(); });
document.getElementById("sayEn").addEventListener("click", () => speak(CARDS[cur].en, "en-US", detail));
document.getElementById("sayJa").addEventListener("click", () => speak(CARDS[cur].ja, "ja-JP", detail));

/* ---------------- クイズ ---------------- */
const quizGrid = document.getElementById("quizGrid");
const askBtn = document.getElementById("ask");
const scoreEl = document.getElementById("score");
let target = null, hit = 0, tries = 0, locked = false;

const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function newRound(){
  locked = false;
  const pick = shuffle(CARDS.map((_,i)=>i)).slice(0,3);
  target = pick[Math.floor(Math.random()*3)];
  quizGrid.innerHTML = "";
  pick.forEach(i => {
    const b = cardEl(CARDS[i], i);
    b.querySelector(".en").remove();     // 文字は隠して、絵と音だけで当てる
    b.addEventListener("click", () => answer(b, i));
    quizGrid.appendChild(b);
  });
  setTimeout(() => speak(CARDS[target].en, "en-US", askBtn), 250);
}
function answer(el, i){
  if(locked) return;
  tries++;
  if(i === target){
    locked = true; hit++;
    el.classList.add("right");
    burst(el);
    speak(CARDS[i].en + ". " , "en-US", askBtn);
    setTimeout(newRound, 1300);
  } else {
    el.classList.add("wrong");
    setTimeout(() => el.classList.remove("wrong"), 400);
  }
  scoreEl.textContent = `${hit} / ${tries}`;
}
function burst(el){
  const r = el.getBoundingClientRect();
  const box = document.createElement("div");
  box.className = "burst";
  for(let n=0;n<12;n++){
    const s = document.createElement("span");
    s.textContent = ["🎉","✨","⭐","🎊"][n%4];
    s.style.left = (r.left + r.width/2) + "px";
    s.style.top  = (r.top + r.height/2) + "px";
    s.style.setProperty("--dx", (Math.random()*260-130)+"px");
    s.style.setProperty("--dy", (-Math.random()*220-60)+"px");
    s.style.setProperty("--rot", (Math.random()*540-270)+"deg");
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1000);
}
askBtn.addEventListener("click", () => speak(CARDS[target].en, "en-US", askBtn));

/* ---------------- モード切り替え ---------------- */
const mBook = document.getElementById("m-book"), mQuiz = document.getElementById("m-quiz");
function mode(q){
  mBook.setAttribute("aria-pressed", !q);
  mQuiz.setAttribute("aria-pressed", q);
  document.getElementById("book").hidden = q;
  document.getElementById("quiz").hidden = !q;
  speechSynthesis.cancel();
  if(q) newRound();
}
mBook.addEventListener("click", () => mode(false));
mQuiz.addEventListener("click", () => mode(true));
</script>
</body>
</html>
